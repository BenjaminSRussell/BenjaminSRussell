<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="scrape clean ship machine">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A120B"/>
      <stop offset="100%" stop-color="#2C241C"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8A6A3D"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4896A"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <radialGradient id="steamG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DCC8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8DCC8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#field)"/>

  <!-- soft ground haze (no hard line) -->
  <ellipse cx="640" cy="500" rx="520" ry="36" fill="#000" opacity="0.25"/>

  <!-- left intake pipes (gather) -->
  <path d="M40 220 C180 200 220 260 320 250" fill="none" stroke="url(#copper)" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <path d="M40 280 C160 300 230 290 320 270" fill="none" stroke="#8A6A3D" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  <path d="M40 160 C150 140 240 190 320 220" fill="none" stroke="#B08D57" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- messy motes drifting into pipes -->
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="0.0s" repeatCount="indefinite" path="M60 150 C140 130 240 160 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="0.3s" repeatCount="indefinite" path="M60 162 C140 142 240 172 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="0.7s" repeatCount="indefinite" path="M60 174 C140 154 240 184 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="1.0s" repeatCount="indefinite" path="M60 186 C140 166 240 196 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="1.4s" repeatCount="indefinite" path="M60 198 C140 178 240 208 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="1.8s" repeatCount="indefinite" path="M60 210 C140 190 240 220 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="2.1s" repeatCount="indefinite" path="M60 222 C140 202 240 232 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="2.4s" repeatCount="indefinite" path="M60 234 C140 214 240 244 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="2.8s" repeatCount="indefinite" path="M60 246 C140 226 240 256 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="3.1s" repeatCount="indefinite" path="M60 258 C140 238 240 268 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="3.5s" repeatCount="indefinite" path="M60 270 C140 250 240 280 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="3.8s" repeatCount="indefinite" path="M60 282 C140 262 240 292 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="4.2s" repeatCount="indefinite" path="M60 294 C140 274 240 304 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="4.5s" repeatCount="indefinite" path="M60 306 C140 286 240 316 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="4.9s" repeatCount="indefinite" path="M60 158 C140 138 240 168 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="4.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E8DCC8" opacity="0.35">
    <animateMotion dur="6s" begin="5.2s" repeatCount="indefinite" path="M60 170 C140 150 240 180 310 250"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="5.2s" repeatCount="indefinite"/>
  </circle>

  <!-- central boiler / engine (clean) -->
  <ellipse cx="640" cy="300" rx="160" ry="120" fill="#241a12" opacity="0.9"/>
  <ellipse cx="640" cy="300" rx="150" ry="110" fill="none" stroke="url(#brass)" stroke-width="6"/>
  <ellipse cx="640" cy="300" rx="120" ry="88" fill="none" stroke="#B87333" stroke-width="2" opacity="0.5"/>

  <!-- slow gear -->
  <g transform="translate(640 300)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle r="48" fill="none" stroke="url(#brass)" stroke-width="10"/>
      <circle r="18" fill="#1A120B" stroke="#D4A574" stroke-width="3"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(0)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(30)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(60)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(90)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(120)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(150)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(180)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(210)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(240)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(270)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(300)"/>
      <rect x="-5" y="-62" width="10" height="16" rx="2" fill="#B08D57" transform="rotate(330)"/>
    </g>
  </g>

  <!-- right outflow (ship) -->
  <path d="M800 250 C920 240 1040 200 1240 180" fill="none" stroke="url(#brass)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M800 280 C940 300 1080 260 1240 250" fill="none" stroke="#B87333" stroke-width="10" stroke-linecap="round" opacity="0.65"/>

  <!-- ordered beads leaving -->
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="0.0s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="0.4s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="0.8s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="1.2s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="1.6s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="2.0s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="2.4s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="2.8s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="3.2s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#D4A574">
    <animateMotion dur="5.5s" begin="3.6s" repeatCount="indefinite" path="M820 260 C940 250 1080 210 1220 190"/>
    <animate attributeName="opacity" values="0;0.9;0.3" dur="5.5s" begin="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- STEAM -->
  <ellipse cx="580" cy="160" rx="22" ry="30" fill="url(#steamG)">
    <animate attributeName="cy" values="190;110;190" dur="7s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;28;16" dur="7s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="0.0s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="160" rx="22" ry="30" fill="url(#steamG)">
    <animate attributeName="cy" values="190;110;190" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;28;16" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="8s" begin="0.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="160" rx="22" ry="30" fill="url(#steamG)">
    <animate attributeName="cy" values="190;110;190" dur="9s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;28;16" dur="9s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="9s" begin="1.6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="610" cy="160" rx="22" ry="30" fill="url(#steamG)">
    <animate attributeName="cy" values="190;110;190" dur="10s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;28;16" dur="10s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="10s" begin="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="670" cy="160" rx="22" ry="30" fill="url(#steamG)">
    <animate attributeName="cy" values="190;110;190" dur="11s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;28;16" dur="11s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- pressure dial -->
  <g transform="translate(520 200)">
    <circle r="28" fill="#1A120B" stroke="#B08D57" stroke-width="3"/>
    <circle r="3" fill="#D4A574"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#E8DCC8" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-40;50;-40" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

</svg>
