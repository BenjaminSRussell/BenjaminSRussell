# chart.toml — every printed string the sheets and README share, and the knobs Ben turns.
# Measured data lives in assets/stats.json (written by build_stats.py); colour, line and type in
# scripts/tokens.py. Nothing in this file is a measurement. Edit here, not in README.md.

[chart]
login = "BenjaminSRussell"
release = "v9"
seed = 27
breakpoint_px = 767
base_url = "https://raw.githubusercontent.com/BenjaminSRussell/BenjaminSRussell/chart/assets/v9/"
branch = "chart"
out_dir = "assets/v9"

[identity]
# Author identities whose commits are "Ben's". Everything else is `others`; bots are dropped.
names = ["Benjamin Russell", "Ben Russell", "BenjaminSRussell"]
emails = ["benjamin.sheldon.russell@gmail.com", "russell27sail@gmail.com"]
bots = ["github-actions[bot]", "google-labs-jules[bot]", "Claude"]

[position]
# "" omits the slot everywhere (check.py warns); any ⟨ ⟩ placeholder fails the build.
text = ""

[contact]
# "" drops the link.
linkedin = ""
resume = ""

[copy]
thesis = "I survey a web that is wrong about itself."
role_line = "Crawl and data infrastructure · Python and Rust"
unit_chart = "SOUNDINGS IN COMMIT-DAYS"   # the hero's unit line (v10, D2)
unit_hero = "SOUNDINGS IN COMMITS"         # read by the soundings sheet (sheet 2) until that module retires; not the hero's
unit_approaches = "SOUNDINGS IN URLS · THOUSANDS"
limit_label = "LIMIT OF SURVEY 2026"
footer_line = "The chart ends here. The web doesn't."
log_footnote = "Heights observed, not predicted."

[copy.review]
# check.py warns once these months have passed: re-read the line.
role_line = "2027-06"
thesis = "2027-06"

[motion]
enabled = true

[budgets]
# From tokens.BUDGETS (MASTERPLAN 7.3); check.py reads tokens, these are the printed copy.
svg_kb = 300
gz_kb = 100
elements = 3000
phone_svg_kb = 120
page_gz_kb = 250

[log]
path = "assets/log.json"

[social]
hero_png_sha = ""

# ----------------------------------------------------------------- features
# The hero is composed by hand and driven by data (round 4, D3): a repository with seven commit-days or more is a
# named feature and takes the slot set here (`desk` and `phone` are its centre in sheet coordinates); its radius
# follows the data and its place never moves. Every other repository is a rock on the fringe below. A repository
# that crosses seven days without a slot here is charted as a rock and reported until it is given one. The alias
# is what every sheet prints; `kind` is harbour | island | bank (a submerged shoal) | vessel (the ship's own ground).

[[features]]
repo = "Scrapy"
aliases = ["Scrapy Harbor"]
kind = "harbour"
desk = [830, 430]
phone = [390, 630]

[[features]]
repo = "Rust-sitemap"
aliases = ["rustmapper"]
kind = "vessel"
desk = [1005, 610]
phone = [545, 730]

[[features]]
repo = "Data_science_dev"
aliases = ["Data Science Bank"]
kind = "bank"
desk = [865, 160]
phone = [330, 500]

[[features]]
repo = "BenjaminSRussell"
aliases = ["Profile Shoal"]
kind = "shoal"
desk = [620, 490]
phone = [150, 640]

[[features]]
repo = "game_engine"
aliases = ["Game Engine I."]
kind = "island"
desk = [724, 262]
phone = [64, 500]

[[features]]
repo = "Data-visualizer"
aliases = ["Data-visualizer I."]
kind = "island"
desk = [770, 625]
phone = [400, 795]

[[features]]
repo = "Wheel"
aliases = ["Wheel I."]
kind = "island"
desk = [595, 625]
phone = [225, 775]

[[features]]
repo = "FashionDB"
aliases = ["FashionDB Bank"]
kind = "bank"
desk = [440, 560]
phone = [130, 760]

[[features]]
repo = "ideal-url-organizer"
aliases = ["URL Organizer I."]
kind = "island"
desk = [300, 530]
phone = [64, 580]

[hero]
# The rest of the hero's composition (D4), in sheet coordinates. The course runs from the limit of survey to the
# harbour; its last two waypoints (the entrance and the anchorage) follow the harbour's slot and are not set here.
# The rocks fringe is the polyline the unnamed repositories are marked along, south-west of the archipelago.
course_desk = [[1080, 120], [1030, 200], [1000, 330]]
course_phone = [[600, 470], [565, 510], [548, 575]]
rocks_desk = [[210, 660], [300, 695], [400, 706], [480, 700]]
rocks_phone = [[30, 848], [140, 864], [260, 870], [380, 868]]
note_desk = [846, 80, -3]

# ----------------------------------------------------------------- claims (figures about the code, not about Ben)
# measured=true needs source + sha; otherwise the sheets set the figure sloping (decision 14).
[claims.scrape_interval]
value = 15
unit = "s"
source = "Scrapy:Scraping_project/monitoring/prometheus.yml (global scrape_interval)"
sha = "74fd4f71b341a2b02f036bf8c8b75b3c4b2818e0"
measured = true

[claims.workers]
value = "256–1024"
unit = "permits"
source = "Rust-sitemap:src/orchestration/governor.rs"
sha = "00a877d1fcd0c5ee91da8fb0b81f8150ae46d5c9"
measured = false      # the repo README (32–512), PyPI (256) and the code disagree: never upright

[claims.shards]
value = "num_cpus"
unit = "shards"
source = "Rust-sitemap:src/lib.rs (num_cpus::get())"
sha = "00a877d1fcd0c5ee91da8fb0b81f8150ae46d5c9"
measured = true

# ----------------------------------------------------------------- sources
# rustmapper's three seed sources; `first` is optional and left out until measured.
[[sources]]
letter = "A"
name = "SITEMAPS"

[[sources]]
letter = "B"
name = "CT LOGS"

[[sources]]
letter = "C"
name = "COMMON CRAWL"

