# ----------------------------------------------------------------- alt text (T8, with decision 29)
# Templates: {key} is filled from stats.json / derived figures; a sheet module's alt(data, cfg)
# wins when it exists. ≤ 25 words, plain register, first word not "The".
[alt]
hero = "Chart of Ben Russell's {repo_count} repositories as a coastline, one row per repository, Scrapy and rustmapper the largest. One row is one repository."
soundings = "Tide table: fifty-two weeks of commits as a curve, high and low water dated. Every week sounded."
approaches = "Chart of two systems: rustmapper's survey lines east, a buoyed channel west into Scrapy Harbor, legend below. The soundings fill in behind the vessel."
log = "Ship's log on ruled paper: one rustmapper crawl, computed from settings, unsigned. Types once; only the cursor keeps time."
instruments = "Equipment list: languages, stores and queues, deck; the date each was first fitted. Bold: underway this quarter; the rest when asked."
footer = "Limit of survey: a dotted line, hatched ground beyond, a sailboat anchored short of the edge. The chart ends here; the web doesn't."
alt_poem = [
  "One row is one repository.",
  "Every week sounded.",
  "The soundings fill in behind the vessel.",
  "Types once; only the cursor keeps time.",
  "Bold: underway this quarter; the rest when asked.",
  "The chart ends here; the web doesn't.",
]

