[facts]
# The dependencies worth naming in each flagship's "Built on" line (round 5, F3.3), printed in this order where the
# manifest has them (case and -/_ ignored; a name also matches its -binary build); a repository without a list
# prints its manifest's first five.
built_on.Scrapy = ["deltalake", "redis", "psycopg2", "prometheus-client", "datasketch"]
built_on.Rust-sitemap = ["tokio", "redb", "rkyv", "reqwest", "clap"]

# ----------------------------------------------------------------- route (round 6, SPEC §5.3)
# The way into rustmapper, in the order a URL goes through it. scripts/data/route.py checks every anchor in the
# Rust-sitemap clone at its HEAD (`head`) and in the released sdist (`release`); an entry is drawn only when all of
# them hold, and check.py fails while any does not. An anchor is {path} (the file exists), {path, text} (the file
# contains the literal), {path, absent} (it does not) or {path, const} (it defines that numeric constant; the
# text prints it as {const:NAME}); `fn` narrows text/absent to one function. kind: stop | trap | end | export.
[route.rustmapper]
repo = "Rust-sitemap"
project = "rustmapper"
header = "Crawls a site and writes one line for every page it reaches."
# the sentence rests on the code that writes the file, at HEAD and in the release, and on the run check's crawl
header_head = [{path = "src/orchestration/shutdown.rs", text = 'join("sitemap.jsonl")'}, {path = "src/state.rs", text = "pub struct SitemapNode"}]
header_release = [{path = "src/main.rs", text = 'join("sitemap.jsonl")'}, {path = "src/state.rs", text = "pub struct SitemapNode"}]
header_runs = ["crawl_ctrl_c"]

# README lines that wait on work in Rust-sitemap (SPEC §1, §4 block 5): the cargo install line is printed once the
# P1 test (a site whose robots.txt is a 404 is crawled) and the P2 test (--duration stops a stalled crawl) are at HEAD.
[route.rustmapper.gates]
cargo = [{path = "tests/robots_4xx_allows_crawl.rs"}, {path = "tests/duration_stops_stalled_crawl.rs"}]
# review round 3: "the Python API built with maturin is on main" is said only while main has it
python_api = [{path = "python/rustmapper/__init__.py"}, {path = "pyproject.toml", text = 'bindings = "pyo3"'}]

# The route is the run's order: what you type, what happens to each URL, how you stop it, what you get. The rows with
# `loop = true` repeat for every page, and the image draws one line back from the last of them to the first.
# `runs` / `fails` name run-check probes (scripts/runcheck.py) that must have passed / failed for the release.

[[route.rustmapper.entry]]
id = "S1"
kind = "stop"
scope = "release"          # the default is the release's: 0.1.3 seeds from all three, HEAD from none
file = "seeder.rs"
# review round 3: the tool's rows in the third person, the reader's one step (C1) in the imperative
text = "your URL, plus by default sitemaps, certificate logs, Common Crawl"
release = [{path = "src/seeder.rs"}, {path = "src/sitemap_seeder.rs"}, {path = "src/ct_log_seeder.rs"},
           {path = "src/common_crawl_seeder.rs"}, {path = "src/cli.rs", text = 'default_value = "all"'}]
[[route.rustmapper.entry.instead]]
text = "your URL, plus sitemaps, certificate logs, Common Crawl if asked"
release = [{path = "src/seeder.rs"}, {path = "src/sitemap_seeder.rs"}, {path = "src/ct_log_seeder.rs"},
           {path = "src/common_crawl_seeder.rs"}, {path = "src/cli.rs", text = 'default_value = "none"'}]

[[route.rustmapper.entry]]
id = "S2"
kind = "stop"
loop = true                # the queue: the loop's way back ends here once this stop is drawn
file = "frontier.rs"
text = "one queue per host, paced by that host's robots.txt"
# the test file is P1 (SPEC §1): at 32c2651 a site whose robots.txt answers 404 is never crawled
head = [{path = "src/frontier.rs", text = "struct ReadyHost"}, {path = "src/robots.rs", text = "fn fetch_robots_txt"},
        {path = "tests/robots_4xx_allows_crawl.rs"}]
release = [{path = "src/frontier.rs", text = "struct ReadyHost"}, {path = "src/robots.rs", text = "fn fetch_robots_txt"}]

# Review round 3: the scope fact lives here, where it is a fact about which links are queued, not a cause. "Above or
# below": url_utils.rs is_same_domain takes the start's subdomains and every domain it ends with (start on
# blog.x.org and x.org is crawled too); siblings are not.
[[route.rustmapper.entry]]
id = "F1"
kind = "stop"
loop = true
file = "bfs_crawler.rs"
text = "fetches a page; queues links on its domain, above or below it"
head = [{path = "src/bfs_crawler.rs", text = "frontier.add_links(discovered_links)"},
        {path = "src/bfs_crawler.rs", text = "BfsCrawler::is_same_domain("},
        {path = "src/url_utils.rs", fn = "is_same_domain", text = "url_domain.ends_with(base_domain)"},
        {path = "src/url_utils.rs", fn = "is_same_domain", text = "base_domain.ends_with(url_domain)"}]
release = [{path = "src/bfs_crawler.rs", text = "frontier.add_links(discovered_links)"},
           {path = "src/bfs_crawler.rs", text = "BfsCrawler::is_same_domain("},
           {path = "src/url_utils.rs", fn = "is_same_domain", text = "url_domain.ends_with(base_domain)"},
           {path = "src/url_utils.rs", fn = "is_same_domain", text = "base_domain.ends_with(url_domain)"}]
runs = ["crawl_ctrl_c"]

[[route.rustmapper.entry]]
id = "G1"
kind = "note"              # it acts on the fetches from the side (semaphore permits), so no ring on the line
loop = true
file = "governor.rs"
text = "fetches fewer pages at once when saving falls behind"
head = [{path = "src/orchestration/governor.rs", text = "THROTTLE_THRESHOLD_MS"},
        {path = "src/orchestration/governor.rs", text = "add_permits"}]
release = [{path = "src/main.rs", text = "THROTTLE_THRESHOLD_MS"}, {path = "src/main.rs", text = "add_permits"}]

# The figure is the constant as the code defines it, in both trees. Review round 3: what a kill leaves, and the
# command that gets the pages back, are said once, on C1.
[[route.rustmapper.entry]]
id = "W1"
kind = "stop"
loop = true
file = "writer_thread.rs"
text = "saved every {const:BATCH_TIMEOUT_MS} ms"
head = [{path = "src/writer_thread.rs", const = "BATCH_TIMEOUT_MS"},
        {path = "src/writer_thread.rs", text = "Duration::from_millis(BATCH_TIMEOUT_MS)"}]
release = [{path = "src/writer_thread.rs", const = "BATCH_TIMEOUT_MS"},
           {path = "src/writer_thread.rs", text = "Duration::from_millis(BATCH_TIMEOUT_MS)"}]

# One hazard, on the loop. Review round 3: its words are its cause, not its scope. In 0.1.3 the check "frontier
# empty and no tasks in flight" sits in the `else =>` arm of tokio::select!, which runs only when every branch is
# disabled, and that never happens (Rust-sitemap #65, fixed on main in d751cf0); the run check's three-page crawl,
# all three pages written, was still running at 150 s (probe ends_by_itself). Once a release ends by itself, the
# empty alternative retires the row: no hazard is drawn and the track's gap closes.
[[route.rustmapper.entry]]
id = "H1"
kind = "trap"
scope = "release"
loop = true
text = "never stops by itself, even after the last page"
release = [{path = "src/bfs_crawler.rs", fn = "start_crawling", text = "else =>"},
           {path = "src/bfs_crawler.rs", fn = "start_crawling", text = "Crawl complete: frontier empty"}]
runs = ["crawl_ctrl_c"]
fails = ["ends_by_itself"]
[[route.rustmapper.entry.instead]]
text = ""
release = [{path = "src/bfs_crawler.rs"}]
runs = ["ends_by_itself"]

# The reader's one step, and what to do when the process was killed instead (in a container the stop is TERM, then
# KILL, and 0.1.3 listens for Ctrl-C only): export-sitemap reads the stored state (CrawlerState, saved every 50 ms
# by the writer), never the WAL. Backticks set code in the code face.
[[route.rustmapper.entry]]
id = "C1"
kind = "step"
text = "press Ctrl-C once to write `data/sitemap.jsonl`; after a kill, run `export-sitemap`"
head = [{path = "src/orchestration/shutdown.rs", text = "Force quit requested, exiting immediately"},
        {path = "src/orchestration/shutdown.rs", text = 'join("sitemap.jsonl")'},
        {path = "src/orchestration/export.rs", fn = "run_export_sitemap_command", text = "CrawlerState::new(&data_dir)"},
        {path = "src/orchestration/export.rs", fn = "run_export_sitemap_command", absent = "WalReader"},
        {path = "src/cli.rs", text = "ExportSitemap"}]
release = [{path = "src/main.rs", text = "Force quit requested, exiting immediately"},
           {path = "src/main.rs", text = 'join("sitemap.jsonl")'},
           {path = "src/main.rs", fn = "run_export_sitemap_command", text = "CrawlerState::new(&data_dir)"},
           {path = "src/main.rs", fn = "run_export_sitemap_command", absent = "WalReader"},
           {path = "src/cli.rs", text = "ExportSitemap"}]
runs = ["crawl_ctrl_c", "export_after_kill"]
fails = ["kill_writes_file"]
[[route.rustmapper.entry.instead]]
text = "press Ctrl-C once to write `data/sitemap.jsonl`"
head = [{path = "src/orchestration/shutdown.rs", text = "Force quit requested, exiting immediately"},
        {path = "src/orchestration/shutdown.rs", text = 'join("sitemap.jsonl")'}]
release = [{path = "src/main.rs", text = "Force quit requested, exiting immediately"},
           {path = "src/main.rs", text = 'join("sitemap.jsonl")'}]
runs = ["crawl_ctrl_c", "kill_writes_file"]

[[route.rustmapper.entry]]
id = "R13"
kind = "end"
file = "data/sitemap.jsonl"
text = "fields: `url, depth, status_code, title, …`"
head = [{path = "src/state.rs", text = "pub struct SitemapNode"}, {path = "src/state.rs", text = "pub depth: u32"},
        {path = "src/state.rs", text = "pub status_code: Option<u16>"}, {path = "src/state.rs", text = "pub title: Option<String>"}]
release = [{path = "src/state.rs", text = "pub struct SitemapNode"}, {path = "src/state.rs", text = "pub depth: u32"},
           {path = "src/state.rs", text = "pub status_code: Option<u16>"}, {path = "src/state.rs", text = "pub title: Option<String>"}]
runs = ["crawl_ctrl_c"]

# Review round 3 (the developer choosing a crawler): two sentences under the install block, checked by the same
# engine and never drawn (kind "text"). L1, the release pip installs: how hard it hits a site. HostState::new gives
# each host 20 requests in flight and no delay; --workers defaults to 256 in all (main has since raised it to 512);
# only robots.txt's Crawl-delay sets a pause.
[[route.rustmapper.entry]]
id = "L1"
kind = "text"
scope = "release"
text = "It sends up to {field:max_inflight} requests at a time to one host, {arg:workers} in all, with no pause between them unless the site's `robots.txt` sets a `Crawl-delay`."
release = [{path = "src/state.rs", field = "max_inflight"}, {path = "src/state.rs", field = "crawl_delay_secs", equals = "0"},
           {path = "src/state.rs", text = "host_state.crawl_delay_secs = delay"}, {path = "src/cli.rs", arg = "workers"}]

# X1, release only: 0.1.3's export writes every page into one <urlset>; the sitemap format allows 50,000 URLs per
# file, the figure main's own SitemapIndexWriter splits at (sitemap_writer.rs). Retired once a release splits.
[[route.rustmapper.entry]]
id = "X1"
kind = "text"
scope = "release"
from_head = true
text = "{release} writes one `sitemap.xml` however many pages it found; the sitemap format allows {const:DEFAULT_MAX_URLS_PER_SITEMAP} URLs per file."
head = [{path = "src/sitemap_writer.rs", const = "DEFAULT_MAX_URLS_PER_SITEMAP"}]
release = [{path = "src/main.rs", fn = "run_export_sitemap_command", text = "SitemapWriter::new(&output)"},
           {path = "src/main.rs", absent = "SitemapIndexWriter"}, {path = "src/sitemap_writer.rs", absent = "SitemapIndexWriter"}]
[[route.rustmapper.entry.instead]]
text = ""
release = [{path = "src/sitemap_writer.rs", text = "SitemapIndexWriter"}]

# ----------------------------------------------------------------- hand-offs (round 6, SPEC §5.4)
# A join between two of his repositories counts only when code on the receiving side proves it.
[[handoffs]]
id = "sitemap-jsonl→ideal-url-organizer"
kind = "fields"
from = "Rust-sitemap"
to = "ideal-url-organizer"
file = "data/sitemap.jsonl"
writer = "src/state.rs"
writer_struct = "SitemapNode"
reader = "scripts/import_rust_sitemapper.py"
reader_list = "URL_RECORD_FIELDS"
