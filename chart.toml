name = "SITEMAPS"

[[sources]]
letter = "B"
name = "CT LOGS"

[[sources]]
letter = "C"
name = "COMMON CRAWL"

# ----------------------------------------------------------------- notices
# Hand-entered notices (T8). N = len(notices) + release notices appended from stats.json.
# Review round 2: a cite's month is computed, never typed. Each `{month:<key>}` is the author month of the first
# commit by an [identity] author that adds `text` to `repo` (git log --reverse -S, scripts/data/proof.py).
# checks/notices.py fails a printed cite whose anchor is not found (NOTICE-DATE) or whose code an agent wrote first
# (NOTICE-AUTHOR), unless the cite says so (`names_agent = true`). `date` is the first anchor's month, for the
# notices list in stats.json; NOTICE-DATE fails when it differs from the computed one.
