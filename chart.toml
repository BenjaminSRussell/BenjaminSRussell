# ----------------------------------------------------------------- route (round 6, SPEC §5.3)
# The way into rustmapper, in the order a URL goes through it. scripts/data/route.py checks every anchor in the
# Rust-sitemap clone at its HEAD (`head`) and in the released sdist (`release`); an entry is drawn only when all of
# them hold, and check.py fails while any does not. An anchor is {path} (the file exists), {path, text} (the file
# contains the literal), {path, absent} (it does not) or {path, const} (it defines that numeric constant; the
# text prints it as {const:NAME}); `fn` narrows text/absent to one function. kind: stop | trap | end | export.
[route.rustmapper]
repo = "Rust-sitemap"
project = "rustmapper"
# review round 6: "URL it finds", not "page it reaches": a link to a missing page gets a line too (status_code null)
header = "Crawls a site and writes one line for every URL it finds."
# the sentence rests on the code that writes the file, at HEAD and in the release, and on the run check's crawl
header_head = [{path = "src/orchestration/shutdown.rs", text = 'join("sitemap.jsonl")'}, {path = "src/state.rs", text = "pub struct SitemapNode"}]
header_release = [{path = "src/main.rs", text = 'join("sitemap.jsonl")'}, {path = "src/state.rs", text = "pub struct SitemapNode"}]
header_runs = ["crawl_ctrl_c"]
# review round 9: the line that introduces the cautions under the install block (the `item` text entries); it goes
# when no item is left. Review round 10 (the owner): the items describe the release pip installs, and the facts line
# just above dates main (whose --workers default is 512 and seeding default "none"), so the lead names the release
# ({release}, filled by render_readme.text_blocks) and no item repeats it
list_lead = "Before you run {release}:"
# review round 13 (the owner): the items marked `fold` (what the files miss or get wrong, nothing a server feels)
# go in one <details> after the open list, under this label; the open list keeps what you set or decide first
fold_lead = "What {release}'s files miss or get wrong"

# README lines that wait on work in Rust-sitemap (SPEC §1, §4 block 5): the cargo install line is printed once the
# P1 test (a site whose robots.txt is a 404 is crawled) and the P2 test (--duration stops a stalled crawl) are at HEAD.
[route.rustmapper.gates]
cargo = [{path = "tests/robots_4xx_allows_crawl.rs"}, {path = "tests/duration_stops_stalled_crawl.rs"}]
# review round 9: the python_api gate is gone with the sentence it held ("the Python API … is on main and not yet
# released"); the README speaks of the module only once a wheel ships it (edition.modules)

# Review round 4: README lines that rest on the release (the sdist pip builds). `export_defaults`: the install block
# drops `--data-dir ./data --output sitemap.xml` from its export line while these are the release's defaults, and
# the crawl writes where the export reads. `no_services`: the pick sentence's "no services to run" while Redis is an
# opt-in flag of the crawl (a clap bool is false unless given).
[route.rustmapper.release_gates]
export_defaults = [{path = "src/cli.rs", block = "ExportSitemap", arg = "data_dir", equals = "./data"},
                   {path = "src/cli.rs", block = "ExportSitemap", arg = "output", equals = "./sitemap.xml"},
                   {path = "src/cli.rs", block = "Crawl", arg = "data_dir", equals = "./data"}]
no_services = [{path = "src/cli.rs", block = "Crawl", text = 'help = "Enable distributed crawling with Redis")]'},
               {path = "src/cli.rs", block = "Crawl", text = "enable_redis: bool,"}]
# review round 5: the block's "# sitemap.xml, even after a kill:" comment. The release's export opens the stored state
# (CrawlerState, written by the writer in batches) and never the WAL, and writes a sitemap; the run check's
# export_after_kill must have passed and kill_writes_file failed (render_readme.stop_lines).
export_after_kill = [{path = "src/main.rs", fn = "run_export_sitemap_command", text = "CrawlerState::new(&data_dir)"},
                     {path = "src/main.rs", fn = "run_export_sitemap_command", absent = "WalReader"},
                     {path = "src/main.rs", fn = "run_export_sitemap_command", text = "SitemapWriter::new"},
                     {path = "src/cli.rs", block = "ExportSitemap", arg = "output"}]
# review round 16 (the data engineer): the block's count of blank rows. 0.1.3 writes each node as one line of
# `serde_json::to_string` (compact, so a blank is the literal `"crawled_at":null`, no space) to sitemap.jsonl in the
# crawl's ./data; probe blank_rows checked that `grep -c` of that literal counts exactly the blank rows
# (render_readme.stop_lines prints it while this holds and the probe did not fail).
blank_rows = [{path = "src/state.rs", text = "pub crawled_at: Option<"},
              {path = "src/bfs_crawler.rs", fn = "export_to_jsonl", text = "serde_json::to_string(&node)"},
              {path = "src/main.rs", text = 'join("sitemap.jsonl")'},
              {path = "src/cli.rs", block = "Crawl", arg = "data_dir", equals = "./data"}]

# The route is the run's order: what you type, what happens to each URL, how you stop it, what you get. The rows with
# `loop = true` repeat for every page, and the image draws one line back from the last of them to the first.
# `runs` / `fails` name run-check probes (scripts/runcheck.py) that must have passed / failed for the release.

[[route.rustmapper.entry]]
id = "S1"
kind = "stop"
scope = "release"          # the default is the release's: 0.1.3 seeds from all three, HEAD from none
file = "seeder.rs"
# review round 3: the tool's rows in the third person, the reader's one step (C1) in the imperative
# review round 6: what the seeds buy. Each gives URLs no link leads to: a sitemap lists pages, the certificate-log
# seeder yields https://<subdomain>/ for every subdomain crt.sh knows (ct_log_seeder.rs, both trees), Common Crawl
# every URL it indexed under the domain
# review round 7: the aside set off by commas, and "looked up rather than followed" (each seeder queries a file or
# an index; none follows a link)
# review round 9: a verb, as every other row has; F1, the next row, says links are followed. "subdomains in" is cut
# so the row is two phone lines and one desk line (what a certificate log gives is said by the anchor below, and the
# README's L2 item names crt.sh)
# Review round 11 (the student): the command, named where the screenshot carries it. The package is rustmapper, the
# command 0.1.3 ships is rust_sitemap (`edition.scripts`); "{script}" is filled by route.command_name, as the
# README's block names it, so it prints rustmapper by itself once a release ships that script. It rests on the
# release's clap subcommand (`Crawl {` in cli.rs) and probe crawl_help (`<cmd> crawl --help` names --start-url).
# Without the probe, the old words, with no command.
text = "`{script} crawl` starts from your URL; by default also from sitemaps, certificate logs and Common Crawl"
head = [{path = "src/ct_log_seeder.rs", text = 'format!("https://{}/", subdomain)'}]
release = [{path = "src/seeder.rs"}, {path = "src/sitemap_seeder.rs"}, {path = "src/ct_log_seeder.rs"},
           {path = "src/ct_log_seeder.rs", text = 'format!("https://{}/", subdomain)'},
           {path = "src/common_crawl_seeder.rs"}, {path = "src/cli.rs", text = 'default_value = "all"'},
           {path = "src/cli.rs", block = "Commands", text = "Crawl {"}]
runs = ["crawl_help"]
[[route.rustmapper.entry.instead]]
