# chart.toml — every printed string the sheets and README share, and the knobs Ben turns.
# Measured data lives in assets/stats.json (written by build_stats.py); colour, line and type in
# scripts/tokens.py. Nothing in this file is a measurement. Edit here, not in README.md.

[chart]
login = "BenjaminSRussell"
release = "v9"
seed = 27
breakpoint_px = 767
base_url = "https://raw.githubusercontent.com/BenjaminSRussell/BenjaminSRussell/chart/assets/v9/"
branch = "chart"
out_dir = "assets/v9"

[identity]
# Author identities whose commits are "Ben's". Everything else is `others`; bots are dropped.
names = ["Benjamin Russell", "Ben Russell", "BenjaminSRussell"]
emails = ["benjamin.sheldon.russell@gmail.com", "russell27sail@gmail.com"]
bots = ["github-actions[bot]", "google-labs-jules[bot]", "Claude"]

[position]
# "" omits the slot everywhere (check.py warns); any ⟨ ⟩ placeholder fails the build.
text = ""

[contact]
# "" drops the link.
linkedin = ""
resume = ""

[copy]
role_line = "Crawl and data infrastructure · Python and Rust"
unit_chart = "SOUNDINGS IN COMMIT-DAYS"   # the hero's unit line (v10, D2)
unit_hero = "SOUNDINGS IN COMMITS"         # read by the soundings sheet (sheet 2) until that module retires; not the hero's
unit_approaches = "SOUNDINGS IN URLS · THOUSANDS"
limit_label = "LIMIT OF SURVEY 2026"
footer_line = "The chart ends here. The web doesn't."
# review round 3: which of the two tools is for which job (README marker `pick`). Printed only while rustmapper's
# route header holds (it writes one line per page, SitemapNode) and every [[figures]] row with use = "pick" holds.
pick = "For the list of a site's URLs from one command, **rustmapper**; to keep the pages themselves, deduplicated and summarised, in a pipeline that needs Docker, **Scrapy**."
log_footnote = "Heights observed, not predicted."

[copy.review]
# check.py warns once these months have passed: re-read the line.
role_line = "2027-06"

[motion]
enabled = true

[budgets]
# From tokens.BUDGETS (MASTERPLAN 7.3); check.py reads tokens, these are the printed copy.
svg_kb = 300
gz_kb = 100
elements = 3000
phone_svg_kb = 120
page_gz_kb = 250

[log]
path = "assets/log.json"

[social]
hero_png_sha = ""

# ----------------------------------------------------------------- hero (round 6: the way into rustmapper)
# The hero is drawn from `routes.rustmapper` (below, checked by scripts/data/route.py) and nothing else that has
# a size. `aliases` maps a repository to the name the sheet prints (its package name).
[hero.aliases]
"Rust-sitemap" = "rustmapper"

# ----------------------------------------------------------------- lines (round 5, D2)
# `lines` counts newlines of source files at HEAD from a depth-1 clone. Directories here are never his lines:
# vendored, build output, environments. `[lines.exclude]` names generated trees per repository.
[lines]
exclude_dirs = ["node_modules", "vendor", "target", "build", "dist", ".venv", "venv", "__pycache__", "site-packages", "third_party"]

[lines.exclude]
game_engine = ["src/engine"]   # 5,212 generated C files over 8 commit-days (round 5 data memo §2); not typed

# ----------------------------------------------------------------- claims (figures about the code, not about Ben)
# measured=true needs source + sha; otherwise the sheets set the figure sloping (decision 14).
[claims.shards]
value = "num_cpus"
unit = "shards"
source = "Rust-sitemap:src/lib.rs (num_cpus::get())"
sha = "00a877d1fcd0c5ee91da8fb0b81f8150ae46d5c9"
measured = true

# ----------------------------------------------------------------- sources
# rustmapper's three seed sources; `first` is optional and left out until measured.
[[sources]]
