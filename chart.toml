# chart.toml — every printed string the sheets and README share, and the knobs Ben turns.
# Measured data lives in assets/stats.json (written by build_stats.py); colour, line and type in
# scripts/tokens.py. Nothing in this file is a measurement. Edit here, not in README.md.

[chart]
login = "BenjaminSRussell"
release = "v9"
seed = 27
breakpoint_px = 1199   # review round 6: GitHub's README column is under 766 px below a 1200 px viewport (DESIGN.md)
base_url = "https://raw.githubusercontent.com/BenjaminSRussell/BenjaminSRussell/chart/assets/v9/"
branch = "chart"
out_dir = "assets/v9"

[identity]
# Author identities whose commits are "Ben's". Everything else is `others`; bots are dropped.
names = ["Benjamin Russell", "Ben Russell", "BenjaminSRussell"]
emails = ["benjamin.sheldon.russell@gmail.com", "russell27sail@gmail.com"]
bots = ["github-actions[bot]", "google-labs-jules[bot]", "Claude"]

[position]
# "" omits the slot everywhere (check.py warns); any ⟨ ⟩ placeholder fails the build.
text = ""

[contact]
# "" drops the link.
linkedin = ""
resume = ""

[copy]
role_line = "Crawl and data infrastructure · Python and Rust"
unit_chart = "SOUNDINGS IN COMMIT-DAYS"   # the hero's unit line (v10, D2)
unit_hero = "SOUNDINGS IN COMMITS"         # read by the soundings sheet (sheet 2) until that module retires; not the hero's
unit_approaches = "SOUNDINGS IN URLS · THOUSANDS"
limit_label = "LIMIT OF SURVEY 2026"
footer_line = "The chart ends here. The web doesn't."
# review round 3: which of the two tools is for which job (README marker `pick`). Printed only while rustmapper's
# route header holds (it writes one line per page, SitemapNode), every [[figures]] row with use = "pick" holds, and
# (review round 4: it takes three steps, not one command) the release gate `no_services` holds: Redis is a flag.
# Review round 5: the names first, where a reader scanning line starts finds them.
# Review round 7: "His **Scrapy** repository", not the Scrapy framework (64.7k stars, `Scrapy` on PyPI); no
# "pipeline", which names the framework's item pipelines; American spelling, as the rest of the page.
pick = "**rustmapper** gives you a site's list of URLs from one binary, with no services to run. His **Scrapy** repository keeps the pages themselves, deduplicated and summarized, and needs Docker."
# Review round 7: the Languages line's first two (what the page is about); the rest is every other main_language of
# his public repositories, ordered by how many repositories, then lines (render_readme.languages_block)
languages_lead = ["Python", "Rust"]
# Review round 7: how the data line names a repository whose name is also a well-known project's
repo_words = {Scrapy = "the Scrapy repository"}
log_footnote = "Heights observed, not predicted."

[copy.review]
# check.py warns once these months have passed: re-read the line.
role_line = "2027-06"

[motion]
enabled = true

[budgets]
# From tokens.BUDGETS (MASTERPLAN 7.3); check.py reads tokens, these are the printed copy.
svg_kb = 300
gz_kb = 100
elements = 3000
phone_svg_kb = 120
page_gz_kb = 250

[log]
path = "assets/log.json"

[social]
hero_png_sha = ""

# ----------------------------------------------------------------- hero (round 6: the way into rustmapper)
# The hero is drawn from `routes.rustmapper` (below, checked by scripts/data/route.py) and nothing else that has
# a size. `aliases` maps a repository to the name the sheet prints (its package name).
[hero.aliases]
"Rust-sitemap" = "rustmapper"

# ----------------------------------------------------------------- lines (round 5, D2)
# `lines` counts newlines of source files at HEAD from a depth-1 clone. Directories here are never his lines:
# vendored, build output, environments. `[lines.exclude]` names generated trees per repository.
[lines]
exclude_dirs = ["node_modules", "vendor", "target", "build", "dist", ".venv", "venv", "__pycache__", "site-packages", "third_party"]

[lines.exclude]
game_engine = ["src/engine"]   # 5,212 generated C files over 8 commit-days (round 5 data memo §2); not typed

# ----------------------------------------------------------------- claims (figures about the code, not about Ben)
# measured=true needs source + sha; otherwise the sheets set the figure sloping (decision 14).
[claims.shards]
value = "num_cpus"
unit = "shards"
source = "Rust-sitemap:src/lib.rs (num_cpus::get())"
sha = "00a877d1fcd0c5ee91da8fb0b81f8150ae46d5c9"
measured = true

# ----------------------------------------------------------------- sources
# rustmapper's three seed sources; `first` is optional and left out until measured.
[[sources]]
letter = "A"
name = "SITEMAPS"

[[sources]]
letter = "B"
name = "CT LOGS"

[[sources]]
letter = "C"
name = "COMMON CRAWL"

# ----------------------------------------------------------------- notices
# Hand-entered notices (T8). N = len(notices) + release notices appended from stats.json.
# Review round 2: a cite's month is computed, never typed. Each `{month:<key>}` is the author month of the first
# commit by an [identity] author that adds `text` to `repo` (git log --reverse -S, scripts/data/proof.py).
# checks/notices.py fails a printed cite whose anchor is not found (NOTICE-DATE) or whose code an agent wrote first
# (NOTICE-AUTHOR), unless the cite says so (`names_agent = true`). `date` is the first anchor's month, for the
# notices list in stats.json; NOTICE-DATE fails when it differs from the computed one.
[[notices]]
n = 1
title = "Boring under load."
# review round 7: the breaker that runs. The old cite (fd33c11, `class CircuitBreaker` in src/common/error_handling.py)
# was a class nothing called, deleted six days later (1b0f502). His 099dd6c (8 Oct 2026) adds the per-host breakers
# of stage 2 (`_host_breakers`, stage2_worker.py): after 5 URLs on a host fail every retry, it is left alone 60 s.
body = "One failing host is set aside for a minute; the rest of the crawl goes on."
cite = "Scrapy, {month:breaker}: a circuit breaker for each host in stage 2."
anchors = [{key = "breaker", repo = "Scrapy", text = "_host_breakers", author = "self"}]
repo = "Scrapy"
date = "2026-10"
source = "toml"

[[notices]]
n = 2
title = "Raw before clean."
# review round 7: plain claims, one frame at most (the old three read as one poster template)
body = "Next month's question can't be known today, so the raw layer is appended to and never overwritten."
# review round 5: rustmapper's write-ahead log is not cited here: it is truncated after each checkpoint
# (src/wal.rs checkpoint(), every 64 commits or 64 MiB by default), a durability buffer, not a raw layer
# review round 8: the cite in the form of the other three, "<repo>, <Mon YYYY>: <what>." (test_round8 CiteForm)
cite = "Scrapy, {month:delta}: raw pages written to Delta Lake with `write_deltalake`."
anchors = [{key = "delta", repo = "Scrapy", text = "write_deltalake"}]
repo = "Scrapy"
date = "2025-10"
source = "toml"

[[notices]]
n = 3
# review round 8: the measured fact, not the title again. "Before speed" is not what the history shows (the
# performance redesign, 52dcbd8, 4 Oct 2025, came two days before the first dashboard). {days:key} is the days from
# the repository's first commit (rules[].repo_first, git) to that anchor's commit; {days:a..b} the days between two
# anchors' commits (proof.fill_days). 67446a4 25 Sep 2025 -> d571e6e 1 Oct (prometheus_exporter.py, start_http_server)
# -> e8cbe15 6 Oct (monitoring/grafana_dashboard.json, one dashboard).
title = "Measure from the start."
body = "Metrics were exported {days:prometheus} days after the first commit, and a dashboard was up {days:prometheus..grafana} days after that."
cite = "Scrapy, {month:prometheus}: Prometheus metrics, then Grafana dashboards."
anchors = [{key = "prometheus", repo = "Scrapy", text = "prometheus_client"},
           {key = "grafana", repo = "Scrapy", text = '"panels"'}]
repo = "Scrapy"
date = "2025-10"
source = "toml"

[[notices]]
n = 4
title = "Parse, don't pattern-match."
body = "A regex for a URL breaks on the first port or login inside it; `urllib.parse` does not."
# review round 6: the cite is his own commit. The repository's first commits with urllib.parse (9 Nov 2025) are
# Claude's; `author = "self"` scopes the anchor to his first one, 2be623e (13 Nov 2025, `from urllib.parse import
# urlparse` in src/analyzers/semantic_analyzer.py), and NOTICE-AUTHOR checks that commit, not the repository's first
cite = "ideal-url-organizer, {month:urlparse}: URLs split with `urllib.parse`."
anchors = [{key = "urlparse", repo = "ideal-url-organizer", text = "urllib.parse", author = "self"}]
repo = "ideal-url-organizer"
date = "2025-11"
source = "toml"

[[notices]]
n = 5
title = "The surface is part of the system."
body = "A tool that confuses its operator is already failing."
cite = "This page, Nov 2025: its earlier editions read as a template."
repo = "BenjaminSRussell"
date = "2025-11"
source = "toml"

