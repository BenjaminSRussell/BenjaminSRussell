# MinHashLSH. Stage 3 builds its MinHash index fresh for each batch and does not mark a skipped page done, so the
# drain loop summarized a near-duplicate on its next pass (Stage3Worker.run() called twice). What holds: the spider's
# dupe filter drops a repeat request by its fingerprint (settings.py, config.yml has no `scrapy:` section to change
# it), every queue row is keyed by the hash of its canonical URL (pipelines.py _canonical_queue_row), and stage 2
# upserts by that hash. The near-duplicate clause may come back on a test that runs run() twice and expects one summary.
