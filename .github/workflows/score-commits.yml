name: score commits

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/score-commits.yml"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute lifetime commit total + write SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const login = 'BenjaminSRussell';

            const userRes = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  createdAt
                }
              }
            `, { login });

            const created = new Date(userRes.user.createdAt);
            const now = new Date();
            const startYear = created.getUTCFullYear();
            const endYear = now.getUTCFullYear();

            let total = 0;
            for (let year = startYear; year <= endYear; year++) {
              const from = `${year}-01-01T00:00:00Z`;
              const to = `${year}-12-31T23:59:59Z`;
              const yearRes = await github.graphql(`
                query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      totalCommitContributions
                    }
                  }
                }
              `, { login, from, to });
              const c = yearRes.user.contributionsCollection;
              total += (c.totalCommitContributions || 0);
            }

            const formatted = total.toLocaleString('en-US');
            const stamp = now.toISOString().slice(0, 10);

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<!-- BSR∴profile∴6 · score-commits · Actions refresh · ${stamp} · total=${total} -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 140" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${formatted} total commits">
  <defs>
    <radialGradient id="scWashV" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scWashT" cx="82%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scWashL" cx="50%" cy="20%" r="42%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="scBlur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="140" fill="#0B0D10"/>
  <ellipse cx="280" cy="70" rx="320" ry="90" fill="url(#scWashV)" filter="url(#scBlur)"/>
  <ellipse cx="1000" cy="72" rx="280" ry="80" fill="url(#scWashT)" filter="url(#scBlur)"/>
  <ellipse cx="640" cy="36" rx="220" ry="50" fill="url(#scWashL)" filter="url(#scBlur)"/>
  <text x="640" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="4" fill="#E8E4DF">${formatted}</text>
  <rect x="520" y="88" width="240" height="1.5" rx="1" fill="url(#scRule)" opacity=".7"/>
  <text x="640" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="3.2" fill="#94A3B8" opacity=".9">TOTAL COMMITS</text>
</svg>
`;

            const out = path.join('assets', 'score-commits.svg');
            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync(out, svg, 'utf8');
            core.setOutput('total', String(total));
            core.info(`Lifetime commit total: ${total}`);

      - name: Commit score SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/score-commits.svg
          if git diff --cached --quiet; then
            echo "No score change"
            exit 0
          fi
          git commit -m "chore(profile): refresh total commits score"
          git push
