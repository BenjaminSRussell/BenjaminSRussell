name: README links

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/links.yml"
  pull_request:
  schedule:
    # Weekly Monday 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The sheets on the orphan `chart` branch are generated and gated by scripts/check.py (xml, size,
      # README structure); they are excluded here because the branch is rewritten by the chart workflow.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --max-concurrency 4
            --include-mail=false
            --exclude '^https://github\.com/.*/actions/workflows/'
            --exclude 'raw\.githubusercontent\.com/BenjaminSRussell/BenjaminSRussell/chart/'
            README.md
          fail: true
