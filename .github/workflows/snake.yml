name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23131417&color_dots=%23EBEDF0,%23FFD8C7,%23FFAD8A,%23FF7A45,%23E8501A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF5A1F&color_dots=%23161B22,%233A2A24,%237A3F26,%23C1491F,%23FF5A1F

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
