name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D9442B&color_dots=%23E6DCC6,%23C7CCD8,%2396A4BC,%235A6D8C,%231B2A41
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF6A3D&color_dots=%23172740,%23243A5C,%233B5A86,%236F8FBF,%23DCE4F0

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
