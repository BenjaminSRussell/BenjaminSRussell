# The chart's weekly job (round 4, D9: weekly and on push, not nightly): take the soundings, redraw the
# hero, render the README, pass the gate, commit the small JSON + README to main, publish the sheet to
# the orphan `chart` branch. A failed sounding publishes last week's figures with the dated pencil note;
# a failed gate publishes nothing and the job is red. Nothing is half-published: the publish is one
# force-push.
#
# The gate runs the fast and render tiers here. The perf tier (repaint budgets, scripts/checks/perf.py)
# left CI in round 4 and is a dev tool: `python3 scripts/check.py --tier perf` locally.
name: chart

on:
  schedule:
    - cron: "20 6 * * 0"    # Sunday 06:20 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but commit and push nothing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "chart.toml"
      - "assets/log.json"
      - "requirements.txt"
      - ".github/workflows/profile.yml"
  repository_dispatch:
    types: [release-published]

concurrency:
  group: chart
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Round 6 (SPEC §6): the image claims only what the tool does. Install PyPI's latest rustmapper on Apple silicon
  # (the only platform with a prebuilt wheel), run each executable the wheel ships, crawl a local site with no
  # robots.txt, send one Ctrl-C, check data/sitemap.jsonl and the exported sitemap. The record always uploads, pass
  # or fail; the gate (check.py ROUTE-ENTRANCE) refuses to ship an entrance that did not run.
  runcheck:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the README's install lines
        run: python3 scripts/runcheck.py --latest --python "$(which python3)" --out runcheck.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runcheck
          path: runcheck.json
          retention-days: 14

  chart:
    needs: runcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true      # no record: build_stats keeps the last one, and the gate fails once it is 14 days old
        with:
          name: runcheck
          path: runcheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned requirements
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright Chromium (render tier of check.py)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Take the day's soundings (stats.json, log.json)
        id: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py --runcheck runcheck/runcheck.json

      - name: Draw the hero in every edition
        id: assets
        run: python3 scripts/build_assets.py --heartbeat

      - name: Render the README's build-written regions
        id: readme
        run: python3 scripts/render_readme.py

      - name: Gate (check.py, fast and render tiers; exit 2 = warnings only, allowed)
        id: gate
        run: |
          set +e
          python3 scripts/check.py --tier fast,render
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Upload check artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ github.run_id }}
          path: |
            assets/build-report.json
            out/check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit stats, log, lock and README to main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one missing pathspec makes `git add` stage nothing at all (run 5: "main: no change" while the
          # survey had moved), so the files are added one by one and only when they exist
          for f in assets/stats.json assets/log.json assets/layout.lock.json README.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "main: no change"
            exit 0
          fi
          git commit -m "chart: soundings $(date -u +%F)"
          # the build leaves other tracked files modified (assets/build-report.json), and a plain
          # `git pull --rebase` refuses with "You have unstaged changes" (run 9: both attempts failed and
          # the step still went green because the loop just ended); --autostash parks them, and the
          # step fails unless an attempt pushed
          pushed=0
          for attempt in 1 2; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::could not push the survey to main after 2 attempts"
            exit 1
          fi

      - name: Social preview PNGs (ride the chart branch under social/)
        if: steps.gate.outcome == 'success'
        run: node scripts/social.mjs

      - name: Publish sheets to the orphan chart branch
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/publish_chart.py

      - name: Publish, dry run
        if: ${{ inputs.dry_run }}
        run: python3 scripts/publish_chart.py --dry-run

      # The sounding failed: yesterday's figures, the dated pencil note and the dashed datum rule.
      # Still gated, still one push. Anything that fails after the sounding stays unpublished.
      - name: Pencil-note edition (the sounding failed)
        if: ${{ failure() && steps.stats.outcome == 'failure' && !inputs.dry_run }}
        run: |
          python3 scripts/build_assets.py --no-sounding --heartbeat
          python3 scripts/render_readme.py
          set +e
          python3 scripts/check.py --tier fast,render
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python3 scripts/publish_chart.py
